<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geminicon</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      width: 320px;
      padding: 16px;
      font-size: 13px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-badge.connected .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .status-badge.connecting .status-dot {
      background: var(--warning);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 9px 0;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button.disconnect {
      background: #334155;
      color: var(--text);
    }

    button.disconnect:hover {
      background: #475569;
    }

    .stats {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .info-box {
      margin-top: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>Geminicon</h1>
    <div id="statusBadge" class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <div class="form-group">
    <label for="serverUrl">Gateway Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8765" spellcheck="false">
  </div>

  <button id="toggleBtn">Connect</button>

  <div class="info-box">
    Ensure you are logged into <strong>gemini.google.com</strong> in this browser. Prompts execute inside silent background Temporary Chats.
  </div>

  <div class="stats">
    <span>Tasks Completed: <strong id="taskCount" style="color: var(--text)">0</strong></span>
    <span id="activeSessionInfo">No active session</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
